[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sessionreel"
version = "0.1.0"
description = "Turn a Claude Code session log into a 30-60 second recap video. Local, redacted, no API key."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Youngmin Ko" }]
keywords = ["claude-code", "coding-agent", "video", "recap", "session", "ffmpeg"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Topic :: Software Development",
]
dependencies = ["Pillow>=10.0", "Pygments>=2.15", "imageio-ffmpeg>=0.5"]

[project.urls]
Homepage = "https://github.com/mandu5/sessionreel"
Issues = "https://github.com/mandu5/sessionreel/issues"

[project.scripts]
sessionreel = "sessionreel.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/sessionreel"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/*.gif", "docs/*.mp4", "out", ".github"]
